<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coordenação · Equitar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="js/config.js"></script>
    <script src="js/auth-api.js"></script>
    <script src="js/auth-guard.js"></script>
    <script src="js/role-guard.js"></script>

    <script src="js/components/theme.js"></script>
    <link rel="stylesheet" href="css/theme.css">
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased min-h-screen flex flex-col selection:bg-clinical-100 selection:text-clinical-800">

    <div class="app-shell">
    <aside id="sidebar-root"></aside>
    <div class="app-main">
    <header id="topbar-root"></header>

    <main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-8 py-4 sm:py-6 space-y-6">

        <div id="loading-state" class="bg-white rounded-2xl border border-slate-200 shadow-sm p-10 text-center">
            <div class="flex flex-col items-center gap-3 text-slate-500">
                <i data-lucide="loader-2" class="w-6 h-6 text-clinical-600 animate-spin"></i>
                <p class="text-sm font-medium text-slate-700">Carregando indicadores...</p>
            </div>
        </div>

        <div id="dashboard-content" class="hidden space-y-6">
            <section class="grid grid-cols-2 lg:grid-cols-5 gap-3 sm:gap-4">
                <div class="col-span-2 lg:col-span-1 bg-clinical-600 text-white p-4 rounded-2xl shadow-sm flex flex-col justify-between">
                    <p class="text-xs font-medium text-clinical-100">Taxa de Assiduidade</p>
                    <p id="metric-assiduidade" class="text-3xl font-bold mt-1">0%</p>
                    <p class="text-[11px] text-clinical-100 mt-0.5">Realizados / Agendados</p>
                </div>

                <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between">
                    <div class="flex items-center justify-between">
                        <p class="text-xs font-medium text-slate-500">Agendados</p>
                        <i data-lucide="calendar-days" class="w-4 h-4 text-blue-500"></i>
                    </div>
                    <p id="metric-total" class="text-2xl font-bold text-slate-900 mt-1">0</p>
                </div>

                <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between">
                    <div class="flex items-center justify-between">
                        <p class="text-xs font-medium text-slate-500">Realizados</p>
                        <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-600"></i>
                    </div>
                    <p id="metric-realizados" class="text-2xl font-bold text-emerald-600 mt-1">0</p>
                </div>

                <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between">
                    <div class="flex items-center justify-between">
                        <p class="text-xs font-medium text-slate-500">Faltas s/ Aviso</p>
                        <i data-lucide="user-x" class="w-4 h-4 text-rose-600"></i>
                    </div>
                    <p id="metric-faltas" class="text-2xl font-bold text-rose-600 mt-1">0</p>
                </div>

                <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between">
                    <div class="flex items-center justify-between">
                        <p class="text-xs font-medium text-slate-500">Desmarcados</p>
                        <i data-lucide="calendar-x" class="w-4 h-4 text-amber-600"></i>
                    </div>
                    <p id="metric-desmarcados" class="text-2xl font-bold text-amber-600 mt-1">0</p>
                </div>
            </section>

            <section class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                <div class="p-4 border-b border-slate-100 bg-slate-50/50 flex items-center justify-between">
                    <h2 class="font-bold text-slate-900 text-base flex items-center gap-2">
                        <i data-lucide="alert-triangle" class="w-5 h-5 text-rose-600"></i>
                        Alertas de Absenteísmo
                    </h2>
                    <span id="alerts-count-badge" class="text-xs bg-rose-100 text-rose-700 px-2 py-0.5 rounded-full font-semibold">
                        0 alerta(s)
                    </span>
                </div>

                <div id="alerts-container" class="divide-y divide-slate-100"></div>

                <div id="alerts-empty" class="hidden p-8 text-center text-slate-400 text-xs">
                    Nenhum paciente com faltas consecutivas no momento.
                </div>
            </section>
        </div>

        <div id="error-state" class="hidden card p-8 text-center">
            <p id="error-message" class="text-slate-500 text-sm font-medium">Não foi possível carregar os indicadores.</p>
        </div>
    </main>
    </div>
    </div>

    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script src="js/components/sidebar.js"></script>
    <script src="js/components/topbar.js"></script>
    <script>
        Sidebar.mount('sidebar-root');
        Topbar.mount('topbar-root', {
            title: 'Coordenação',
            subtitle: 'Indicadores globais da clínica.',
            actionsHtml: `
                <button id="refresh-btn" class="btn-secondary">
                    <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                    <span class="hidden sm:inline">Atualizar</span>
                </button>
            `,
        });
    </script>

    <script src="js/coordenacao-api.js"></script>
    <script src="js/coordenacao.js"></script>
</body>
</html>
