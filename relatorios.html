<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatórios · Equitar</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script src="js/config.js"></script>
    <script src="js/auth-api.js"></script>
    <script src="js/auth-guard.js"></script>
    <script src="js/role-guard.js"></script>

    <script src="js/components/theme.js"></script>
    <link rel="stylesheet" href="css/theme.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <div class="app-shell">
    <aside id="sidebar-root"></aside>
    <div class="app-main">
    <header id="topbar-root"></header>

    <main class="flex-grow max-w-6xl mx-auto px-4 sm:px-8 py-8 w-full">
        
        <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 mb-8">
            <h2 class="text-sm font-semibold text-slate-500 uppercase tracking-wider mb-4">Filtros de Busca</h2>
            
            <form id="filterForm" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 items-end">
                <div class="flex flex-col gap-1">
                    <label for="patientName" class="text-sm font-medium text-slate-700">Nome do Paciente</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="ph ph-user text-slate-400"></i>
                        </div>
                        <input type="text" id="patientName" placeholder="Ex: Maria Silva"
                            class="form-input pl-10">
                    </div>
                </div>

                <div class="flex flex-col gap-1">
                    <label for="startDate" class="text-sm font-medium text-slate-700">Data Inicial</label>
                    <input type="date" id="startDate" class="form-input">
                </div>

                <div class="flex flex-col gap-1">
                    <label for="endDate" class="text-sm font-medium text-slate-700">Data Final</label>
                    <input type="date" id="endDate" class="form-input">
                </div>

                <div class="flex gap-2 w-full lg:justify-end">
                    <button type="button" id="clearBtn" class="btn-secondary flex-1 lg:flex-none">
                        Limpar
                    </button>
                    <button type="submit" class="btn-primary flex-1 lg:flex-none">
                        <i class="ph ph-magnifying-glass text-lg"></i>
                        Buscar
                    </button>
                </div>
            </form>
        </section>

        <section>
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    Resultados Encontrados
                    <span id="resultsCount" class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded-full border border-blue-200">
                        0
                    </span>
                </h2>
            </div>

            <div id="recordsContainer" class="flex flex-col gap-4">
            </div>
            
            <div id="emptyState" class="hidden flex-col items-center justify-center py-12 text-center bg-white rounded-xl border border-slate-200 border-dashed">
                <div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mb-4 text-slate-400">
                    <i class="ph ph-magnifying-glass text-3xl"></i>
                </div>
                <h3 class="text-slate-800 font-medium text-lg">Nenhum prontuário encontrado</h3>
                <p class="text-slate-500 text-sm max-w-sm mt-1">Tente ajustar os filtros de busca para encontrar o que você está procurando.</p>
            </div>
        </section>
    </main>
    </div>
    </div>

    <script src="js/components/sidebar.js"></script>
    <script src="js/components/topbar.js"></script>
    <script>
        Sidebar.mount('sidebar-root');
        Topbar.mount('topbar-root', {
            title: 'Relatórios',
            subtitle: 'Evoluções e ocorrências registradas por atendimento.',
            actionsHtml: `
                <a href="index.html" class="btn-secondary">
                    <i data-lucide="calendar-check" class="w-4 h-4"></i>
                    <span class="hidden sm:inline">Voltar à Agenda</span>
                </a>
            `,
        });
    </script>

    <script src="js/autocomplete.js"></script>
    <script src="js/pacientes-api.js"></script>
    <script src="js/relatorios-api.js"></script>
    <script src="js/relatorios.js"></script>
</body>
</html>
