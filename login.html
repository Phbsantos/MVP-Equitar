<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - Clínica Integrada</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        clinical: {
                            50: '#e6f6f3', 100: '#c2e6df', 200: '#99d6ce', 300: '#6cc3b6',
                            400: '#3fb09e', 500: '#1caf9a', 600: '#159583', 700: '#117a6c',
                            800: '#0d6055', 900: '#0a4a41',
                        },
                        blue: {
                            50: '#e6f6f3', 100: '#c2e6df', 200: '#99d6ce', 300: '#6cc3b6',
                            400: '#3fb09e', 500: '#1caf9a', 600: '#159583', 700: '#117a6c',
                            800: '#0d6055', 900: '#0a4a41',
                        },
                        indigo: {
                            50: '#e6f6f3', 100: '#c2e6df', 200: '#99d6ce', 300: '#6cc3b6',
                            400: '#3fb09e', 500: '#1caf9a', 600: '#159583', 700: '#117a6c',
                            800: '#0d6055', 900: '#0a4a41',
                        },
                        slate: {
                            50: '#faf6f0', 100: '#f2ede4', 200: '#dfe0ed', 300: '#c5c7da',
                            400: '#9b9eb1', 500: '#7d8095', 600: '#60657e', 700: '#454a63',
                            800: '#2c3049', 900: '#1b2653',
                        },
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer components {
            .btn-primary {
                @apply inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-xl bg-clinical-600 text-white font-semibold text-sm shadow-md shadow-clinical-200 hover:bg-clinical-700 active:bg-clinical-800 transition disabled:opacity-60 disabled:cursor-not-allowed;
            }
            .btn-secondary {
                @apply inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-xl bg-white border border-slate-300 text-slate-700 font-semibold text-sm hover:bg-slate-50 transition;
            }
            .form-input {
                @apply w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-clinical-500 focus:bg-white transition;
            }
            .form-label {
                @apply block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1;
            }
            .card {
                @apply bg-white rounded-2xl border border-slate-200 shadow-sm;
            }
        }
    </style>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-900 font-sans text-slate-800 antialiased min-h-screen flex items-center justify-center p-4 selection:bg-clinical-100 selection:text-clinical-800">

    <div class="w-full max-w-sm space-y-6">
        <div class="text-center space-y-2">
            <div class="w-14 h-14 rounded-2xl bg-clinical-600 text-white flex items-center justify-center font-bold text-lg shadow-lg shadow-clinical-900/40 mx-auto">
                <i data-lucide="activity" class="w-7 h-7"></i>
            </div>
            <h1 class="font-bold text-white text-lg">Clínica Integrada</h1>
            <p class="text-xs text-slate-400">Entre com seu e-mail cadastrado</p>
        </div>

        <div class="card p-6 space-y-5">
            <form id="form-login" onsubmit="handleLoginSubmit(event)" class="space-y-4">
                <div>
                    <label for="login-email" class="form-label">E-mail</label>
                    <div class="relative">
                        <i data-lucide="mail" class="w-4 h-4 text-slate-400 absolute left-3 top-3"></i>
                        <input type="email" id="login-email" required autocomplete="username" placeholder="seu.nome@clinica.com" class="form-input pl-9">
                    </div>
                </div>

                <div>
                    <label for="login-senha" class="form-label">Senha</label>
                    <div class="relative">
                        <i data-lucide="lock" class="w-4 h-4 text-slate-400 absolute left-3 top-3"></i>
                        <input type="password" id="login-senha" required autocomplete="current-password" placeholder="••••••••" class="form-input pl-9">
                    </div>
                </div>

                <div id="login-error" class="hidden bg-rose-50 border border-rose-200 rounded-xl p-3 text-xs text-rose-700 flex items-start gap-2">
                    <i data-lucide="alert-circle" class="w-4 h-4 shrink-0 mt-0.5"></i>
                    <span id="login-error-text">E-mail ou senha inválidos.</span>
                </div>

                <button type="submit" id="login-submit-btn" class="btn-primary w-full">
                    <i data-lucide="log-in" class="w-4 h-4"></i>
                    Entrar
                </button>
            </form>
        </div>

        <p class="text-center text-[11px] text-slate-500">Acesso restrito à equipe da clínica.</p>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth-api.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
