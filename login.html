<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar · Equitar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="js/components/theme.js"></script>
    <link rel="stylesheet" href="css/theme.css">
</head>
<body class="bg-slate-900 font-sans text-slate-800 antialiased min-h-screen flex items-center justify-center p-4 selection:bg-clinical-100 selection:text-clinical-800">

    <div class="w-full max-w-sm space-y-6">
        <div class="text-center space-y-2">
            <div class="w-14 h-14 rounded-2xl bg-clinical-600 text-white flex items-center justify-center font-bold text-lg shadow-lg shadow-clinical-900/40 mx-auto">
                <i data-lucide="heart-pulse" class="w-7 h-7"></i>
            </div>
            <h1 class="font-bold text-white text-lg">Equitar</h1>
            <p class="text-xs text-slate-400">Entre com seu e-mail cadastrado</p>
        </div>

        <div class="card p-6 space-y-5">
            <form id="form-login" onsubmit="handleLoginSubmit(event)" class="space-y-4">
                <div>
                    <label for="login-email" class="form-label">E-mail</label>
                    <div class="relative">
                        <i data-lucide="mail" class="w-4 h-4 text-slate-400 absolute left-3 top-3"></i>
                        <input type="email" id="login-email" required autocomplete="username" placeholder="seu.nome@clinica.com" class="form-input pl-9">
                    </div>
                </div>

                <div>
                    <label for="login-senha" class="form-label">Senha</label>
                    <div class="relative">
                        <i data-lucide="lock" class="w-4 h-4 text-slate-400 absolute left-3 top-3"></i>
                        <input type="password" id="login-senha" required autocomplete="current-password" placeholder="••••••••" class="form-input pl-9">
                    </div>
                </div>

                <div id="login-error" class="hidden bg-rose-50 border border-rose-200 rounded-xl p-3 text-xs text-rose-700 flex items-start gap-2">
                    <i data-lucide="alert-circle" class="w-4 h-4 shrink-0 mt-0.5"></i>
                    <span id="login-error-text">E-mail ou senha inválidos.</span>
                </div>

                <button type="submit" id="login-submit-btn" class="btn-primary w-full">
                    <i data-lucide="log-in" class="w-4 h-4"></i>
                    Entrar
                </button>
            </form>
        </div>

        <p class="text-center text-[11px] text-slate-500">Acesso restrito à equipe da clínica.</p>
    </div>

    <script src="js/config.js"></script>
    <script src="js/usuarios-api.js"></script>
    <script src="js/auth-api.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
